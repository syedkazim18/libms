<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Library</title>
<style>
:root{--bg:#e9eeee;--glass:#ffffffb8;--card:#fffffff0;--ink:#0d1514;--mut:#6a7776;--line:#0d151416;--t:#0f9f8f;--t2:#2e8b6e;--tl:#d9f2ee;--dk:#0b1211;--dk2:#10302c;--ok:#12805c;--okb:#dcf5ea;--wn:#a15c07;--wnb:#fdf0d8;--bd:#b42323;--bdb:#fde5e5;--sh:0 10px 40px #0d15141a}
:root[data-t=dark]{--bg:#070b0b;--glass:#111a19b8;--card:#141d1cf0;--ink:#eef6f5;--mut:#8ea09e;--line:#ffffff18;--tl:#12332f;--dk:#050808;--okb:#12382b;--ok:#5be0a8;--wnb:#3b2c0e;--wn:#f5bd5a;--bdb:#401919;--bd:#ff8a8a;--sh:0 10px 40px #0008}
*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--ink);font:14.5px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;background:radial-gradient(900px 500px at 12% 8%,#2ec4b633,transparent),radial-gradient(800px 600px at 92% 88%,#2e8b6e33,transparent),var(--bg);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.shell{display:grid;grid-template-columns:230px 1fr;gap:18px;padding:18px;min-height:100vh;max-width:1500px;margin:auto}
.side{background:var(--glass);backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:32px;padding:22px 14px;position:sticky;top:18px;height:calc(100vh - 36px);display:flex;flex-direction:column;box-shadow:var(--sh)}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px;padding:0 10px 26px;letter-spacing:-.3px}.logo i{width:32px;height:32px;border-radius:11px;background:linear-gradient(135deg,var(--t),var(--t2));display:grid;place-items:center;color:#fff;font-style:normal}
.side nav{display:grid;gap:4px}.nv{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:99px;cursor:pointer;color:var(--mut);transition:.18s}.nv:hover{background:var(--tl);color:var(--ink)}.nv.on{background:var(--dk);color:#fff;box-shadow:0 6px 18px #0d151440}
.prof{margin-top:auto;text-align:center;padding-top:14px;border-top:1px solid var(--line)}.av{width:54px;height:54px;border-radius:50%;margin:0 auto 8px;background:linear-gradient(135deg,var(--t),var(--t2));color:#fff;display:grid;place-items:center;font-size:20px;font-weight:700}.prof small{color:var(--mut);display:block}
.lk{background:none;border:0;color:var(--t);cursor:pointer;font-size:13px;padding:2px 6px}
.main{min-width:0;display:flex;flex-direction:column;gap:16px}
.top{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.pl{background:var(--card);border:1px solid var(--line);border-radius:99px;height:46px;display:flex;align-items:center;gap:10px;padding:0 18px;box-shadow:var(--sh)}
.pl input{all:unset;flex:1;min-width:120px}.sr{flex:1;min-width:220px}.ib{width:46px;padding:0;justify-content:center;cursor:pointer;position:relative;transition:.15s}.ib:hover{background:var(--tl)}.ib.dk{background:var(--dk);color:#fff}
.bdg{position:absolute;top:-4px;right:-4px;background:var(--t);color:#fff;border-radius:99px;font-size:11px;min-width:20px;height:20px;display:grid;place-items:center;font-weight:700}
.page{animation:u .3s}h1{font-size:34px;letter-spacing:-1px;margin:4px 0 2px;font-weight:600}.sub{color:var(--mut);margin:0 0 18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:28px;padding:20px;box-shadow:var(--sh)}.card h3{margin:0 0 14px;font-size:15px}
.dk{background:linear-gradient(135deg,var(--dk),var(--dk2));color:#eef6f5;border-color:#ffffff10}.dk .m,.dk .sub{color:#9bb5b1}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:14px}.st b{display:block;font-size:30px;letter-spacing:-1px;font-weight:600}.st span{font-size:12px;color:#9bb5b1}
.g2{display:grid;grid-template-columns:1.2fr 1fr;gap:16px;margin-top:16px}.m{color:var(--mut);font-size:13px}
.row{display:flex;align-items:center;gap:10px;margin:9px 0;font-size:13px}.row i{display:block;height:9px;border-radius:9px;background:linear-gradient(90deg,var(--t),#5fe0c8);transition:width .6s}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}.ch{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:6px 14px;cursor:pointer;white-space:nowrap;transition:.15s}.ch:hover{border-color:var(--t)}.ch.on{background:var(--dk);color:#fff;border-color:var(--dk)}
.az{display:flex;flex-wrap:wrap;gap:3px;margin:10px 0}.az button{all:unset;cursor:pointer;width:27px;height:27px;border-radius:50%;display:grid;place-items:center;font-size:12px;color:var(--mut);transition:.15s}.az button:hover{background:var(--tl);color:var(--ink)}.az button.on{background:var(--t);color:#fff}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:8px 0 14px}.tools select{all:unset;cursor:pointer;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:8px 16px}.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:3px}.seg button{all:unset;cursor:pointer;padding:5px 14px;border-radius:99px;color:var(--mut)}.seg .on{background:var(--dk);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:16px}.bk{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:12px;cursor:pointer;transition:.2s;box-shadow:var(--sh)}.bk:hover{transform:translateY(-4px)}
.cv{height:130px;border-radius:16px;display:grid;place-items:center;color:#fff;font-size:44px;font-weight:700;position:relative;overflow:hidden}.cv:after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 20% 10%,#ffffff40,transparent 55%)}
.bk h4{margin:10px 4px 0;font-size:14px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:36px}.bk p{margin:2px 4px 8px;font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.bk .f{display:flex;justify-content:space-between;align-items:center;margin:0 4px}
.pill{display:inline-block;padding:2px 11px;border-radius:99px;font-size:12px;font-weight:600}.ok{background:var(--okb);color:var(--ok)}.wn{background:var(--wnb);color:var(--wn)}.bd{background:var(--bdb);color:var(--bd)}.gy{background:var(--tl);color:var(--t2)}
.btn{background:var(--dk);color:#fff;border:0;border-radius:99px;padding:8px 18px;cursor:pointer;transition:.15s;font-weight:500}.btn:hover{background:var(--t);transform:translateY(-1px)}.btn.g{background:var(--tl);color:var(--t2)}.btn.g:hover{background:var(--t);color:#fff}.btn[disabled]{opacity:.45;pointer-events:none}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse}th{text-align:left;font-size:11.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.5px;padding:8px 12px;border-bottom:1px solid var(--line)}td{padding:13px 12px;border-bottom:1px solid var(--line)}tr:last-child td{border:0}tbody tr:hover{background:var(--tl)}.t{font-weight:600}
.bar{height:6px;border-radius:9px;background:var(--line);min-width:90px;overflow:hidden}.bar i{display:block;height:100%;background:var(--t);border-radius:9px}.bar.r i{background:#e5484d}
.ov{position:fixed;inset:0;background:#0007;backdrop-filter:blur(4px);z-index:20;display:flex;justify-content:flex-end;animation:f .15s}.ov.c{justify-content:center;align-items:center}.dr{width:min(420px,100vw);height:100%;background:var(--card);padding:26px;overflow:auto;animation:r .25s;border-radius:28px 0 0 28px}.ov.c .dr{height:auto;border-radius:28px;animation:u .2s}
.dr label{font-size:12px;color:var(--mut)}.dr select,.dr input{width:100%;margin:4px 0 14px;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:10px 14px;outline:none}
#nf{position:absolute;right:0;top:56px;width:310px;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:14px;box-shadow:var(--sh);z-index:15;text-align:left;cursor:default}#nf div{padding:9px 6px;border-bottom:1px solid var(--line);font-size:13px}#nf div:last-child{border:0}
#toast{position:fixed;bottom:22px;right:22px;display:grid;gap:8px;z-index:30}.tt{background:var(--dk);color:#fff;padding:11px 18px;border-radius:99px;animation:u .2s;max-width:360px}.tt.e{background:#c62828}
.sk{height:120px;border-radius:24px;background:linear-gradient(90deg,var(--line),var(--tl),var(--line));background-size:200% 100%;animation:s 1.2s infinite}
.auth{min-height:100vh;display:grid;place-items:center;padding:16px}.auth .card{width:min(400px,100%);padding:34px}.auth input{width:100%;margin:6px 0 12px;background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:12px 18px;outline:none}.auth input:focus{border-color:var(--t)}.err{color:var(--bd);font-size:13px;min-height:18px}
@keyframes u{from{opacity:0;transform:translateY(10px)}}@keyframes f{from{opacity:0}}@keyframes r{from{transform:translateX(40px);opacity:0}}@keyframes s{to{background-position:-200% 0}}
@media(max-width:900px){.shell{grid-template-columns:1fr;padding:10px}.side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;border-radius:26px;padding:12px}.side nav{display:flex;flex-wrap:wrap}.prof,.logo{display:none}.g2{grid-template-columns:1fr}h1{font-size:26px}}
.fs{width:100%;margin:4px 0 14px;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:10px 14px;outline:none;color:inherit}.pick{max-height:190px;overflow:auto;margin:-6px 0 12px}.pick .row{padding:8px 12px;border-radius:14px;cursor:pointer;margin:2px 0}.pick .row:hover,.pick .row.on{background:var(--tl)}
</style></head><body><div id="root"></div><div id="toast"></div>
<script>
const $=(s,e=document)=>e.querySelector(s),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const IC={home:"M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z",book:"M4 19V5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2zM4 19a2 2 0 0 0 2 2h13",loan:"M7 7h12l-3-3M17 17H5l3 3",clock:"M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM12 7v5l3 2",coin:"M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM9 9.5h5a1.5 1.5 0 0 1 0 3H10a1.5 1.5 0 0 0 0 3h5",users:"M16 19v-1a4 4 0 0 0-8 0v1M12 11a3 3 0 1 0 0-6 3 3 0 0 0 0 6z",grid:"M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z",bell:"M6 9a6 6 0 0 1 12 0c0 6 2 7 2 7H4s2-1 2-7M10 20a2 2 0 0 0 4 0",find:"M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14zM21 21l-4-4",moon:"M20 14a8 8 0 1 1-10-10 6 6 0 0 0 10 10z"};
const ic=n=>`<svg viewBox="0 0 24 24"><path d="${IC[n]}"/></svg>`;
let U=null,V="home",S={},NF=[];
const api=async(u,o={})=>{const r=await fetch(u,{headers:{"Content-Type":"application/json"},...o,body:o.body?JSON.stringify(o.body):undefined});const d=await r.json().catch(()=>({}));if(!r.ok||d.error)throw new Error(d.error||"Something went wrong");return d},post=(u,b)=>api(u,{method:"POST",body:b||{}});
function toast(m,e){const t=document.createElement("div");t.className="tt"+(e?" e":"");t.textContent=m;$("#toast").append(t);setTimeout(()=>t.remove(),3800)}
const act=async(f,ok)=>{try{await f();ok&&toast(ok);go(V)}catch(e){toast(e.message,1)}},debounce=(f,ms=250)=>{let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>f(...a),ms)}};
const rs=n=>"₹"+Number(n||0).toLocaleString("en-IN"),staff=()=>U&&U.role!=="student",pill=(t,k)=>`<span class="pill ${k}">${esc(t)}</span>`;
const dt=d=>d?new Date(d+"T00:00").toLocaleDateString("en-IN",{day:"numeric",month:"short",year:"numeric"}):"—",daysTo=d=>Math.round((new Date(d+"T00:00")-new Date(new Date().toDateString()))/864e5);
const cover=t=>{let h=0;for(const c of t)h=(h*31+c.charCodeAt(0))%60;return`<div class="cv" style="background:linear-gradient(135deg,hsl(${165+h},55%,38%),hsl(${185+h},60%,24%))">${esc(t[0])}</div>`};
function modal(html,c){const o=document.createElement("div");o.className="ov"+(c?" c":"");o.innerHTML=`<div class="dr">${html}</div>`;o.onclick=e=>{if(e.target===o)o.remove()};document.body.append(o);return o}
function table(cols,rows,empty="Nothing here yet."){if(!rows.length)return`<div class="card m">${empty}</div>`;return`<div class="card tw"><table><thead><tr>${cols.map(c=>`<th>${c[0]}</th>`).join("")}</tr></thead><tbody>${rows.map(r=>`<tr>${cols.map(c=>`<td>${c[1](r)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`}
const page=(t,s,h)=>{$("#pg").innerHTML=`<div class="page"><h1>${t}</h1><p class="sub">${s}</p>${h}</div>`};

async function boot(){U=(await api("/api/me")).user;U?shell():auth()}
function auth(reg){$("#root").innerHTML=`<div class="auth"><div class="card"><div class="logo" style="padding:0 0 18px"><i>L</i>Library</div><h1 style="font-size:28px">${reg?"Create account":"Welcome back"}</h1><p class="sub">${reg?"Student registration":"Sign in to continue"}</p><form id="f">${reg?'<input name="full_name" placeholder="Full name" required><input name="email" type="email" placeholder="Email" required>':""}<input name="username" placeholder="Username" required autofocus><input name="password" type="password" placeholder="Password" required><div class="err" id="er"></div><button class="btn" style="width:100%;padding:13px">${reg?"Register":"Sign in"}</button></form><p class="m" style="margin-top:14px">${reg?'<button class="lk" onclick="auth()">Back to sign in</button>':'<button class="lk" onclick="auth(1)">New student? Register</button><br>Demo: admin / admin123 · aarav.s / student123'}</p></div></div>`;
$("#f").onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));try{if(reg){await post("/api/register",d);toast("Account created. Please sign in.");auth()}else{await post("/api/login",d);boot()}}catch(x){$("#er").textContent=x.message}}}
function shell(){const it=staff()?[["dashboard","Dashboard","grid"],["desk","Issue / Return","loan"],["requests","Requests","loan"],["catalog","Catalog","book"],["loans","Loans","loan"],["reservations","Reservations","clock"],["fines","Fines","coin"],["members","Members","users"]]:[["home","Home","home"],["catalog","Catalog","book"],["loans","My loans","loan"],["requests","My requests","loan"],["reservations","Reservations","clock"],["fines","My fines","coin"]];
V=it[0][0];$("#root").innerHTML=`<div class="shell"><aside class="side"><div class="logo"><i>L</i>Library</div><nav>${it.map(i=>`<button class="nv" data-v="${i[0]}">${ic(i[2])}${i[1]}</button>`).join("")}</nav><div class="prof"><div class="av">${esc(U.full_name[0])}</div><b>${esc(U.full_name)}</b><small>${esc(U.role)}</small><button class="lk" id="lo">Sign out</button></div></aside>
<div class="main"><div class="top"><div class="pl sr">${ic("find")}<input id="gs" placeholder="Search books… (press /)"></div><div class="pl" id="clk"></div><div class="pl ib" id="th" title="Theme">${ic("moon")}</div><div class="pl ib dk" id="bl">${ic("bell")}<span class="bdg" id="bc" hidden>0</span></div></div><div id="pg"></div></div></div>`;
document.querySelectorAll(".nv").forEach(b=>b.onclick=()=>go(b.dataset.v,1));$("#lo").onclick=async()=>{await post("/api/logout");U=null;auth()};$("#th").onclick=()=>{const r=document.documentElement;r.dataset.t=r.dataset.t==="dark"?"":"dark"};
$("#gs").onkeydown=e=>{if(e.key==="Enter"){S={q:e.target.value};go("catalog")}};addEventListener("keydown",e=>{if(e.key==="/"&&!/INPUT|SELECT/.test(document.activeElement.tagName)){e.preventDefault();$("#gs").focus()}});
const tick=()=>$("#clk").textContent=new Date().toLocaleString("en-IN",{weekday:"short",day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"});tick();setInterval(tick,3e4);
$("#bl").onclick=e=>{const o=$("#nf");if(o)return o.remove();const n=document.createElement("div");n.id="nf";n.onclick=x=>x.stopPropagation();n.innerHTML=`<b>Notifications</b>${NF.map(x=>`<div>${x}</div>`).join("")||'<div class="m">You are all caught up.</div>'}`;$("#bl").append(n)};
go(V,1);notif()}
async function notif(){try{const l=await api("/api/loans"),r=await api("/api/reservations"),q=await api("/api/requests");NF=[];if(staff())q.filter(x=>x.status==="Pending").forEach(x=>NF.push(`${pill("Request","wn")} ${esc(x.full_name)} wants to ${x.req_type==="Issue"?"borrow":"return"} ${esc(x.title)}`));else q.filter(x=>x.status==="Rejected").slice(0,2).forEach(x=>NF.push(`${pill("Rejected","bd")} ${esc(x.title)}: ${esc(x.note||"request declined")}`));l.forEach(x=>{const d=daysTo(x.due_date);if(d<0)NF.push(`${pill("Overdue","bd")} ${esc(x.title)}${staff()?" · "+esc(x.member_name):""} is ${-d} day(s) late`);else if(d<=3&&!staff())NF.push(`${pill("Due soon","wn")} ${esc(x.title)} is due ${d?"in "+d+" days":"today"}`)});r.filter(x=>x.status==="Ready").forEach(x=>NF.push(`${pill("Ready","ok")} ${esc(x.title)} is waiting for pickup`));const b=$("#bc");b.hidden=!NF.length;b.textContent=NF.length}catch(e){}}
function go(v,reset){V=v;if(reset)S={};document.querySelectorAll(".nv").forEach(b=>b.classList.toggle("on",b.dataset.v===v));$("#pg").innerHTML='<div class="sk"></div>';views[v]().catch(e=>toast(e.message,1));notif()}

const views={
async dashboard(){const d=await api("/api/dashboard"),t=d.totals,mx=Math.max(1,...d.popular.map(p=>p.total_loans));
page("Overview","Live numbers from MySQL views",`<div class="card dk"><div class="stats">${[["Titles",t.books],["Copies",t.copies],["Members",t.members],["On loan",t.active_loans],["Overdue",t.overdue],["Unpaid fines",rs(t.unpaid_fines)]].map(s=>`<div class="st"><b>${s[1]}</b><span>${s[0]}</span></div>`).join("")}</div></div>
<div class="g2"><div class="card dk"><h3>Most borrowed</h3>${d.popular.map(p=>`<div class="row"><span style="width:42%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(p.title)}</span><i style="width:${p.total_loans/mx*45}%"></i><b>${p.total_loans}</b></div>`).join("")}</div>
<div class="card"><h3>Branches</h3>${d.branches.map(b=>`<div class="row"><span style="width:44%">${esc(b.branch_name)}</span><span class="m">${b.available} free · ${b.issued} out</span></div>`).join("")}</div></div>
<div class="card" style="margin-top:16px"><h3>Recent activity <span class="m">(written by triggers)</span></h3>${d.recent.map(a=>`<div class="row"><span class="m" style="width:135px">${esc(a.changed_at)}</span>${pill(a.action,"gy")}<span>${esc(a.table_name)}</span><span class="m">${esc(a.details)} · ${esc(a.changed_by)}</span></div>`).join("")||'<span class="m">No activity yet.</span>'}</div>`)},

async home(){const[l,f,r,b]=await Promise.all([api("/api/loans"),api("/api/fines"),api("/api/reservations"),api("/api/books?sort=rating")]);const owe=f.filter(x=>x.status==="Unpaid").reduce((a,x)=>a+x.outstanding,0),late=l.filter(x=>x.days_overdue>0).length;
page(`Hello, ${esc(U.full_name.split(" ")[0])}`,"Here is your library at a glance",`<div class="card dk"><div class="stats"><div class="st"><b>${l.length}</b><span>Books borrowed</span></div><div class="st"><b>${late}</b><span>Overdue</span></div><div class="st"><b>${r.filter(x=>["Waiting","Ready"].includes(x.status)).length}</b><span>Reservations</span></div><div class="st"><b>${rs(owe)}</b><span>Fines due</span></div></div></div>
<div class="g2"><div class="card"><h3>Due soon</h3>${l.slice(0,4).map(x=>{const d=daysTo(x.due_date);return`<div class="row"><span style="flex:1"><b>${esc(x.title)}</b><br><span class="m">Due ${dt(x.due_date)}</span></span>${d<0?pill(-d+" days late","bd"):pill(d?d+" days left":"Today",d<=3?"wn":"ok")}</div>`}).join("")||'<span class="m">Nothing borrowed right now.</span>'}</div>
<div class="card"><h3>Top rated</h3>${b.rows.slice(0,4).map(x=>`<div class="row"><span style="flex:1">${esc(x.title)}</span><b>★ ${x.avg_rating??"—"}</b></div>`).join("")}</div></div>`)},

async catalog(){const cats=await api("/api/categories");S={sort:"title",view:"grid",page:1,q:"",category:"",letter:"",avail:"",...S};
page("Catalog","Browse, sort and filter the collection",`<div class="chips"><button class="ch" data-c="">All genres</button>${cats.map(c=>`<button class="ch" data-c="${esc(c.name)}">${esc(c.name)}</button>`).join("")}</div>
<div class="az"><button data-l="">All</button>${[..."ABCDEFGHIJKLMNOPQRSTUVWXYZ"].map(c=>`<button data-l="${c}">${c}</button>`).join("")}</div>
<div class="tools"><div class="pl" style="height:40px">${ic("find")}<input id="q" placeholder="Title, author or ISBN" value="${esc(S.q)}"></div><select id="so"><option value="title">Title A–Z</option><option value="author">Author A–Z</option><option value="newest">Newest first</option><option value="rating">Top rated</option><option value="available">Most available</option></select><label class="ch"><input type="checkbox" id="av" ${S.avail?"checked":""}> Available only</label><div class="seg"><button data-w="grid">Grid</button><button data-w="list">List</button></div><span class="m" id="cnt"></span></div><div id="res"></div>`);
$("#so").value=S.sort;
const mark=()=>{document.querySelectorAll(".ch[data-c]").forEach(b=>b.classList.toggle("on",b.dataset.c===S.category));document.querySelectorAll(".az button").forEach(b=>b.classList.toggle("on",b.dataset.l===S.letter));document.querySelectorAll(".seg button").forEach(b=>b.classList.toggle("on",b.dataset.w===S.view))};
const load=async()=>{mark();const p=new URLSearchParams({q:S.q,category:S.category,letter:S.letter,sort:S.sort,page:S.page,avail:S.avail?1:0});const d=await api("/api/books?"+p);window.LAST=d.rows;$("#cnt").textContent=d.total+" books";
const act=b=>b.available_copies>0?pill(b.available_copies+" free","ok"):pill("All out","wn");
$("#res").innerHTML=(!d.rows.length?'<div class="card m">No books match these filters.</div>':S.view==="grid"?`<div class="grid">${d.rows.map(b=>`<div class="bk" onclick="detail(${b.book_id})">${cover(b.title)}<h4>${esc(b.title)}</h4><p>${esc(b.authors)}</p><div class="f">${act(b)}<span class="m">${b.avg_rating?"★ "+b.avg_rating:""}</span></div></div>`).join("")}</div>`:
table([["Book",b=>`<span class="t">${esc(b.title)}</span><div class="m">${esc(b.authors)}</div>`],["Genre",b=>`<span class="m">${esc(b.categories)}</span>`],["Year",b=>b.publication_year],["Rating",b=>b.avg_rating?"★ "+b.avg_rating:"—"],["",b=>act(b)],["",b=>`<button class="btn g" onclick="detail(${b.book_id})">Open</button>`]],d.rows))+
(d.pages>1?`<div class="tools" style="justify-content:center;margin-top:18px"><button class="btn g" id="pv" ${d.page<=1?"disabled":""}>Previous</button><span class="m">Page ${d.page} of ${d.pages}</span><button class="btn g" id="nx" ${d.page>=d.pages?"disabled":""}>Next</button></div>`:"");
if($("#pv")){$("#pv").onclick=()=>{S.page--;load()};$("#nx").onclick=()=>{S.page++;load()}}};
document.querySelectorAll(".ch[data-c]").forEach(b=>b.onclick=()=>{S.category=b.dataset.c;S.page=1;load()});document.querySelectorAll(".az button").forEach(b=>b.onclick=()=>{S.letter=b.dataset.l;S.page=1;load()});document.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>{S.view=b.dataset.w;load()});
$("#so").onchange=e=>{S.sort=e.target.value;S.page=1;load()};$("#av").onchange=e=>{S.avail=e.target.checked;S.page=1;load()};$("#q").oninput=debounce(e=>{S.q=e.target.value;S.page=1;load()});load()},

async loans(){S.tab=S.tab||"now";const now=S.tab==="now",r=await api(now?"/api/loans":"/api/history");
page(staff()?"Loans":"My loans","Issue and return dates at a glance",`<div class="tools"><div class="seg"><button data-w="now" class="${now?"on":""}">Current</button><button data-w="all" class="${now?"":"on"}">History</button></div></div>`+(now?table([["Book",l=>`<span class="t">${esc(l.title)}</span><div class="m">${esc(l.barcode)} · ${esc(l.branch_name)}</div>`],...(staff()?[["Member",l=>esc(l.member_name)]]:[]),["Issued",l=>dt(l.issue_date)],["Due",l=>dt(l.due_date)],["Time used",l=>{const tot=Math.max(1,daysTo(l.due_date)-daysTo(l.issue_date)),used=Math.min(100,(tot-daysTo(l.due_date))/tot*100);return`<div class="bar ${l.days_overdue>0?"r":""}"><i style="width:${used}%"></i></div>`}],["Status",l=>l.days_overdue>0?pill(l.days_overdue+" days late · "+rs(l.fine_so_far),"bd"):pill(daysTo(l.due_date)+" days left","ok")],["",l=>`<button class="btn g" onclick="act(()=>post('/api/renew',{issue_id:${l.issue_id}}),'Renewed')">Renew</button> ${staff()?`<button class="btn" onclick="act(()=>post('/api/return',{issue_id:${l.issue_id}}).then(x=>{if(x.fine_amount>0)toast('Returned late. Fine '+rs(x.fine_amount),1)}),'Returned')">Return</button>`:`<button class="btn" onclick="act(()=>post('/api/request/return',{issue_id:${l.issue_id}}),'Return request sent to the librarian')">Request return</button>`}`]],r,"No active loans."):
table([["Book",l=>`<span class="t">${esc(l.title)}</span>`],...(staff()?[["Member",l=>esc(l.member_name)]]:[]),["Issued",l=>dt(l.issue_date)],["Due",l=>dt(l.due_date)],["Returned",l=>dt(l.return_date)],["Result",l=>l.status==="Issued"?pill("Out","gy"):l.status==="Lost"?pill("Lost","bd"):l.days_late>0?pill(l.days_late+" days late","wn"):pill("On time","ok")]],r,"No history yet.")));
document.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>{S.tab=b.dataset.w;go("loans")})},

async desk(){const[ms,ln]=await Promise.all([api("/api/members"),api("/api/loans")]);let bk=null;
page("Issue / Return","Lend a book or take one back in a few clicks",`<div class="g2" style="grid-template-columns:1fr 1fr"><div class="card"><h3>Issue a book</h3><label class="m">Member</label><select id="dm" class="fs">${ms.filter(m=>m.status==="Active").map(m=>`<option value="${m.member_id}">${esc(m.full_name)} · ${m.open_loans}/${m.max_books} books</option>`).join("")}</select>
<label class="m">Find a book</label><div class="pl" style="height:42px;margin:4px 0 10px">${ic("find")}<input id="db" placeholder="Title, author or ISBN"></div><div class="pick" id="dl"></div><label class="m">Copy</label><select id="dc" class="fs"><option value="">Pick a book first</option></select><button class="btn" id="di" style="width:100%;padding:12px" disabled>Issue book</button></div>
<div class="card"><h3>Return a book</h3><div class="pl" style="height:42px;margin-bottom:10px">${ic("find")}<input id="rb" placeholder="Barcode, title or member" autofocus></div><div class="pick" id="rl" style="max-height:340px"></div></div></div>`);
const showR=()=>{const q=$("#rb").value.toLowerCase();const r=ln.filter(l=>[l.barcode,l.title,l.member_name].join(" ").toLowerCase().includes(q)).slice(0,8);$("#rl").innerHTML=r.map(l=>`<div class="row"><span style="flex:1"><b>${esc(l.title)}</b><br><span class="m">${esc(l.barcode)} · ${esc(l.member_name)} · due ${dt(l.due_date)}</span></span>${l.days_overdue>0?pill(l.days_overdue+"d late","bd"):""}<button class="btn" data-i="${l.issue_id}">Return</button></div>`).join("")||'<span class="m">No matching loans.</span>';
document.querySelectorAll("#rl [data-i]").forEach(b=>b.onclick=()=>act(()=>post("/api/return",{issue_id:b.dataset.i}).then(x=>{if(x.fine_amount>0)toast("Returned late. Fine "+rs(x.fine_amount),1)}),"Book returned"))};
$("#rb").oninput=showR;showR();
const find=debounce(async()=>{const q=$("#db").value.trim();if(!q){$("#dl").innerHTML="";return}const d=await api("/api/books?avail=1&q="+encodeURIComponent(q));$("#dl").innerHTML=d.rows.map(b=>`<div class="row" data-b="${b.book_id}"><span style="flex:1"><b>${esc(b.title)}</b><br><span class="m">${esc(b.authors)}</span></span>${pill(b.available_copies+" free","ok")}</div>`).join("")||'<span class="m">No available copy found.</span>';
document.querySelectorAll("#dl [data-b]").forEach(r=>r.onclick=async()=>{document.querySelectorAll("#dl .row").forEach(x=>x.classList.remove("on"));r.classList.add("on");bk=r.dataset.b;const c=(await api(`/api/books/${bk}/copies`)).filter(x=>["Available","Reserved"].includes(x.status));$("#dc").innerHTML=c.map(x=>`<option value="${x.copy_id}">${esc(x.barcode)} · ${esc(x.branch_name)}</option>`).join("");$("#di").disabled=!c.length})});
$("#db").oninput=find;
$("#di").onclick=()=>act(async()=>{const r=await post("/api/issue",{member_id:$("#dm").value,copy_id:$("#dc").value});toast("Issued. Due "+dt(r.due_date))})},

async requests(){const r=await api("/api/requests");page(staff()?"Requests":"My requests",staff()?"Approve or reject borrow and return requests":"Apply to borrow or return a book; a librarian approves it",table([["Type",x=>pill(x.req_type,x.req_type==="Issue"?"gy":"wn")],["Book",x=>`<span class="t">${esc(x.title)}</span>`],...(staff()?[["Member",x=>esc(x.full_name)]]:[]),["Requested",x=>dt(String(x.requested_on).slice(0,10))],["Status",x=>pill(x.status,{Pending:"wn",Approved:"ok",Rejected:"bd",Cancelled:"gy"}[x.status])],["Note",x=>`<span class="m">${esc(x.note||"")}</span>`],["",x=>x.status!=="Pending"?"":staff()?`<button class="btn" onclick="act(()=>post('/api/requests/${x.request_id}/approve'),'Approved')">Approve</button> <button class="btn g" onclick="rejectM(${x.request_id})">Reject</button>`:`<button class="btn g" onclick="act(()=>post('/api/requests/${x.request_id}/cancel'),'Request cancelled')">Cancel</button>`]],r,"No requests yet."))},
async reservations(){const r=await api("/api/reservations");page("Reservations","Served in order when a copy comes back",table([["Book",x=>`<span class="t">${esc(x.title)}</span>`],...(staff()?[["Member",x=>esc(x.full_name)]]:[]),["Reserved",x=>dt(String(x.reserved_on).slice(0,10))],["Hold until",x=>dt(x.expires_on)],["Status",x=>pill(x.status,x.status==="Ready"?"ok":x.status==="Waiting"?"wn":"gy")]],r,"No reservations."))},
async fines(){const r=await api("/api/fines");page(staff()?"Fines":"My fines","Created by a trigger when a book comes back late",table([["Book",f=>`<span class="t">${esc(f.title)}</span>`],...(staff()?[["Member",f=>esc(f.member_name)]]:[]),["Reason",f=>esc(f.reason)],["Date",f=>dt(f.assessed_on)],["Amount",f=>rs(f.amount)],["Balance",f=>rs(f.outstanding)],["Status",f=>pill(f.status,f.status==="Paid"?"ok":f.status==="Unpaid"?"bd":"gy")],["",f=>staff()&&f.status==="Unpaid"?`<button class="btn" onclick="payM(${f.fine_id},${f.outstanding})">Collect</button>`:""]],r,"No fines."))},
async members(){page("Members","Search and review accounts",`<div class="tools"><div class="pl" style="height:40px">${ic("find")}<input id="q" placeholder="Name or email"></div></div><div id="res"></div>`);const load=async()=>{const r=await api("/api/members?q="+encodeURIComponent($("#q").value));$("#res").innerHTML=table([["Member",m=>`<span class="t">${esc(m.full_name)}</span><div class="m">${esc(m.email)}</div>`],["Plan",m=>esc(m.plan_name)],["Loans",m=>`${m.open_loans}/${m.max_books}`],["Fines",m=>m.unpaid_fines>0?pill(rs(m.unpaid_fines),"bd"):"—"],["Expires",m=>dt(m.expiry_date)],["Status",m=>pill(m.status,m.status==="Active"?"ok":"wn")]],r)};$("#q").oninput=debounce(load);load()}};

async function detail(id){const bk=(window.LAST||[]).find(r=>r.book_id===id);if(!bk)return;const al=await api(`/api/books/${id}/also`);const o=modal(`${cover(bk.title)}<h2 style="margin:14px 0 2px;letter-spacing:-.5px">${esc(bk.title)}</h2><p class="m">${esc(bk.authors)}</p><div style="display:flex;gap:6px;flex-wrap:wrap;margin:10px 0">${bk.categories.split(", ").map(c=>pill(c,"gy")).join("")}</div>
<p class="m">${esc(bk.publisher)} · ${bk.publication_year} · ${esc(bk.language)} · ${bk.pages||"?"} pages · ISBN ${esc(bk.isbn)}</p><p>${bk.available_copies>0?pill(bk.available_copies+" of "+bk.total_copies+" copies free","ok"):pill("All copies out","wn")} ${bk.avg_rating?" ★ "+bk.avg_rating+" ("+bk.review_count+")":""}</p>
<div style="display:flex;gap:8px;margin:14px 0">${staff()?(bk.available_copies>0?`<button class="btn" id="is">Issue to member</button>`:""):(bk.available_copies>0?`<button class="btn" id="rq">Request to borrow</button>`:`<button class="btn" id="rv">Reserve</button>`)}${bk.ebook_url?`<a class="btn g" style="text-decoration:none" target="_blank" href="${esc(bk.ebook_url)}">E-book</a>`:""}</div>
<h3>Readers also borrowed</h3>${al.map(x=>`<div class="row"><span style="flex:1">${esc(x.title)}</span><span class="m">${x.common_readers} reader(s)</span></div>`).join("")||'<span class="m">Not enough borrowing data yet.</span>'}`);
if($("#is",o))$("#is",o).onclick=()=>{o.remove();issueM(id)};if($("#rq",o))$("#rq",o).onclick=()=>{o.remove();act(()=>post("/api/request/issue",{book_id:id}),"Request sent. A librarian will approve it.")};if($("#rv",o))$("#rv",o).onclick=()=>{o.remove();act(()=>post("/api/reserve",{book_id:id}),"Reserved. You are in the queue.")}}
async function issueM(bid){const[cp,ms]=await Promise.all([api(`/api/books/${bid}/copies`),api("/api/members")]);const av=cp.filter(c=>["Available","Reserved"].includes(c.status));
const o=modal(`<h3>Issue book</h3><label>Member</label><select id="im">${ms.filter(m=>m.status==="Active").map(m=>`<option value="${m.member_id}">${esc(m.full_name)} (${m.open_loans}/${m.max_books})</option>`).join("")}</select><label>Copy</label><select id="ic">${av.map(c=>`<option value="${c.copy_id}">${esc(c.barcode)} · ${esc(c.branch_name)}</option>`).join("")}</select><div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn g" id="x">Cancel</button><button class="btn" id="ok">Issue</button></div>`,1);
$("#x",o).onclick=()=>o.remove();$("#ok",o).onclick=()=>act(async()=>{const r=await post("/api/issue",{member_id:$("#im",o).value,copy_id:$("#ic",o).value});o.remove();toast("Issued. Due "+dt(r.due_date))})}
function rejectM(id){const o=modal(`<h3>Reject request</h3><label>Reason (optional)</label><input id="rn" placeholder="e.g. Book reserved for another member"><div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn g" id="x">Cancel</button><button class="btn" id="ok">Reject</button></div>`,1);$("#x",o).onclick=()=>o.remove();$("#ok",o).onclick=()=>act(async()=>{await post(`/api/requests/${id}/reject`,{note:$("#rn",o).value});o.remove()},"Request rejected")}
function payM(id,bal){const o=modal(`<h3>Collect fine</h3><label>Amount (balance ${rs(bal)})</label><input id="pa" type="number" step="0.01" value="${bal}"><label>Method</label><select id="pm"><option>Cash</option><option>UPI</option><option>Card</option></select><div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn g" id="x">Cancel</button><button class="btn" id="ok">Collect</button></div>`,1);
$("#x",o).onclick=()=>o.remove();$("#ok",o).onclick=()=>act(async()=>{await post("/api/pay",{fine_id:id,amount:$("#pa",o).value,method:$("#pm",o).value});o.remove()},"Payment recorded")}
boot();
</script></body></html>
